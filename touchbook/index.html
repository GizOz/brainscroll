<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Touchbook</title>
<meta name="theme-color" content="#dff1ec">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Touchbook">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{--acc:#2f8f83;--acc2:#5bbfa8;--ink:#1b1f1e;--mute:#6b7a76;--line:#d9ebe5}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif;color:var(--ink)}
body{background:linear-gradient(180deg,#e2f4ef 0%,#eaf5f1 45%,#eef3f1 100%)}
#app{height:100dvh;max-width:560px;margin:0 auto;display:flex;flex-direction:column;position:relative;padding-top:env(safe-area-inset-top)}
header{display:flex;align-items:center;gap:10px;padding:10px 18px 6px}
.logo{font-family:"New York",ui-serif,Georgia,serif;font-weight:700;font-size:30px;letter-spacing:-.5px;color:var(--acc);flex:1}
.back{width:42px;height:42px;border-radius:50%;background:#fff;border:1px solid var(--line);color:var(--acc);display:none;place-items:center;cursor:pointer;font-size:20px}
.title{font-family:"New York",ui-serif,Georgia,serif;font-weight:700;font-size:26px;flex:1}
#main{flex:1;overflow-y:auto;padding:4px 18px 120px}
.search{width:100%;padding:13px 16px;border-radius:16px;border:1px solid var(--line);background:#fff;font:16px -apple-system,sans-serif;margin:6px 0 14px}
.lead{color:var(--mute);font-size:14.5px;line-height:1.45;margin:2px 0 14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:#fff;border:1px solid var(--line);border-radius:24px;padding:16px;text-align:left;cursor:pointer;box-shadow:0 6px 18px rgba(30,90,80,.08);font:inherit;color:inherit}
.tile .e{font-size:36px;display:block;margin-bottom:8px}
.tile b{display:block;font-size:16px}
.tile span.n{font-size:12.5px;color:var(--mute)}
.tc{background:#fff;border:1px solid var(--line);border-radius:22px;overflow:hidden;margin-bottom:14px;cursor:pointer;box-shadow:0 6px 18px rgba(30,90,80,.08)}
.th{height:150px;background:linear-gradient(150deg,var(--acc2),var(--acc)) center/cover;display:grid;place-items:center;font-size:54px;color:#fff;position:relative}
.th .play{position:absolute;right:12px;bottom:12px;background:rgba(0,0,0,.55);color:#fff;font:700 12px sans-serif;padding:6px 10px;border-radius:999px}
.tb{padding:14px 16px 16px}
.tb h3{font-family:"New York",ui-serif,Georgia,serif;font-size:20px;line-height:1.2;margin-bottom:6px}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.pill{font:600 12px -apple-system,sans-serif;background:#e4f3ee;color:#1f6b61;padding:5px 10px;border-radius:999px}
.tb p{font-size:14.5px;line-height:1.45;color:#4b5a56}
nav{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));display:flex;gap:10px;padding:8px;border-radius:999px;background:rgba(255,255,255,.6);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.7);box-shadow:0 8px 24px rgba(30,90,80,.18);z-index:5}
nav button{width:54px;height:50px;border-radius:25px;border:0;background:rgba(255,255,255,.8);color:#4c5d58;font-size:20px;cursor:pointer}
nav button.on{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff}
.sheet{position:fixed;inset:0;background:rgba(10,30,26,.5);display:none;align-items:flex-end;justify-content:center;z-index:20}
.sheet.show{display:flex}
.panel{background:#fff;width:100%;max-width:560px;border-radius:30px 30px 0 0;max-height:94dvh;overflow:auto;padding-bottom:calc(26px + env(safe-area-inset-bottom))}
.vid{background:#0e1514;aspect-ratio:16/9;display:grid;place-items:center;color:#cfe7e1;text-align:center;font-size:14px}
.vid iframe,.vid video{width:100%;height:100%;border:0;display:block}
.pb{padding:18px 20px 0}
.pb h2{font-family:"New York",ui-serif,Georgia,serif;font-size:26px;line-height:1.15;margin-bottom:8px}
.pb h4{font:700 12px sans-serif;letter-spacing:.6px;text-transform:uppercase;color:var(--acc);margin:18px 0 8px}
.pb p,.pb li{font-size:16px;line-height:1.5;color:#2f3b38}
.pb ol{padding-left:22px}.pb li{margin-bottom:8px}
.warn{background:#fff6e6;border:1px solid #f1dcae;border-radius:16px;padding:12px 14px;font-size:14px;line-height:1.45;color:#6b5420}
.row{display:flex;gap:10px;margin-top:18px}
.btn{border:0;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;font:700 15px -apple-system,sans-serif;padding:13px 20px;border-radius:999px;cursor:pointer}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.on{background:#e4f3ee;color:#1f6b61}
.addv{display:flex;gap:8px;margin-top:10px}
.addv input{flex:1;padding:12px;border-radius:12px;border:1px solid var(--line);font:15px sans-serif}
.empty{color:var(--mute);text-align:center;margin-top:80px;line-height:1.6}
.foot{font-size:12.5px;color:var(--mute);line-height:1.45;margin-top:18px}
</style>
</head>
<body>
<div id="app">
  <header><button class="back" id="back">‹</button><div class="logo" id="logo">Touchbook</div></header>
  <main id="main"></main>
  <nav><button id="nAreas" class="on" aria-label="Areas">🧍</button><button id="nSaved" aria-label="Saved">♡</button><button id="nAbout" aria-label="About">ⓘ</button></nav>
</div>
<div class="sheet" id="sheet"><div class="panel" id="panel"></div></div>
<script>
const AREAS=[
 {id:'head',name:'Head & face',emo:'🙂'},{id:'neck',name:'Neck',emo:'🧣'},{id:'shoulders',name:'Shoulders',emo:'🤷'},
 {id:'upper',name:'Upper back',emo:'🧍'},{id:'lower',name:'Lower back',emo:'🪑'},{id:'hips',name:'Hips & glutes',emo:'🚶'},
 {id:'arms',name:'Arms & hands',emo:'✋'},{id:'legs',name:'Legs',emo:'🦵'},{id:'feet',name:'Feet',emo:'🦶'}
];
/* video: paste a YouTube link or ID, a Vimeo link, or a direct .mp4 link. Leave '' until the video exists. */
const TECH=[
{id:'scalp',area:'head',name:'Scalp friction',who:'Therapist or self-care',pressure:'Light to medium',min:3,goal:'Relaxation and a pleasant start or finish to a session.',steps:['Spread your fingers across the scalp and use the pads, not the nails.','Move the scalp over the skull in small slow circles, without sliding over the hair.','Work from the front hairline to the back, then over the temples and behind the ears.','Finish with slow, long strokes through the hair.'],caution:'Skip over wounds, rashes, or after a recent head injury.',video:''},
{id:'masseter',area:'head',name:'Jaw (masseter) release',who:'Therapist or self-care',pressure:'Light to medium',min:3,goal:'Eases a tight-feeling jaw after clenching or long days.',steps:['Find the thick muscle at the angle of the jaw by clenching your teeth, then relaxing.','Let the jaw hang slightly open.','Use finger pads for slow, steady pressure and slow circles.','Release gradually and check how the jaw feels.'],caution:'If there is jaw pain, clicking, or recent dental work, keep it very light or check with a professional first.',video:''},
{id:'temples',area:'head',name:'Temple circles and forehead strokes',who:'Therapist or self-care',pressure:'Light',min:2,goal:'Calm the face and forehead.',steps:['Place finger pads on the temples.','Make slow, small circles for 20 to 30 seconds.','Stroke from the center of the forehead out to the temples.','Repeat slowly, matching the breathing.'],caution:'Stay light around the eyes. Avoid with a migraine in progress if touch makes it worse.',video:''},
{id:'subocc',area:'neck',name:'Suboccipital release',who:'Therapist',pressure:'Light to medium',min:4,goal:'Relaxes the small muscles at the base of the skull.',steps:['Client lies face up. Cradle the back of the head in your hands.','Place the pads of your fingers just below the base of the skull.','Let the weight of the head sink into your fingertips rather than pushing.','Hold for one to two minutes while the client breathes slowly.'],caution:'Avoid deep pressure on the front or sides of the neck. Stop if there is dizziness, tingling, or sharp pain.',video:''},
{id:'uptrap',area:'neck',name:'Upper trapezius kneading',who:'Therapist or self-care',pressure:'Medium',min:4,goal:'Eases the band of muscle between neck and shoulder.',steps:['Warm the area with a few slow strokes.','Gently lift and squeeze the muscle between thumb and fingers.','Knead in slow, rhythmic waves from the neck outward toward the shoulder.','Finish with long gliding strokes.'],caution:'Avoid pinching hard. Stop if there is numbness or pins and needles in the arm.',video:''},
{id:'levator',area:'neck',name:'Levator scapulae stretch',who:'Self-care',pressure:'Gentle stretch',min:2,goal:'Release the side of the neck that tightens at a desk.',steps:['Sit tall and turn your head about 45 degrees away from the tight side.','Look down toward your armpit.','Use the hand on that side to add the lightest weight to the head.','Breathe and hold 20 to 30 seconds, then repeat on the other side.'],caution:'A stretch should feel like gentle tension. Stop with pain, tingling, or dizziness.',video:''},
{id:'shpet',area:'shoulders',name:'Shoulder petrissage',who:'Therapist',pressure:'Medium',min:5,goal:'Warm and loosen the shoulders.',steps:['With the client face down or seated, place both hands over the top of the shoulder.','Knead in alternating, rhythmic squeezes.','Move from the neck edge out toward the shoulder joint.','Slow down at tender areas and keep breathing steady.'],caution:'Reduce pressure if the client tenses or holds their breath.',video:''},
{id:'pecminor',area:'shoulders',name:'Chest (pec minor) release',who:'Therapist',pressure:'Light to medium',min:4,goal:'Opens a rounded-forward shoulder posture.',steps:['Client lies face up with the arm resting at the side.','Find the area just below the outer part of the collarbone.','Use soft finger pads and sink in slowly as the client exhales.','Hold, then glide gently along the muscle.'],caution:'Nerves and vessels run close by. Stay light and stop with tingling or sharp pain.',video:''},
{id:'erector',area:'upper',name:'Thumb glides beside the spine',who:'Therapist',pressure:'Medium',min:5,goal:'Relieves the long muscles beside the spine.',steps:['Client lies face down. Apply oil and warm the back with long strokes.','Place thumbs on either side of the spine, on the muscle, not the bones.','Glide slowly upward, pausing on tight spots.','Return with light strokes and repeat on the other side.'],caution:'Never press directly on the spine. Adjust pressure to comfort.',video:''},
{id:'efflback',area:'upper',name:'Long effleurage down the back',who:'Therapist',pressure:'Light to medium',min:4,goal:'Warm up the whole back and signal the start of a session.',steps:['Use both hands flat, starting at the lower back.','Glide up along both sides of the spine to the shoulders.','Fan out over the shoulders and slide lightly back down the sides.','Keep the pace slow and the contact continuous.'],caution:'Avoid broken skin and areas of sunburn or infection.',video:''},
{id:'strip',area:'lower',name:'Erector stripping',who:'Therapist',pressure:'Medium',min:5,goal:'Ease the muscles on both sides of the lower spine.',steps:['Client lies face down with a pillow under the hips if comfortable.','Use the heel of the hand or a soft forearm on the muscle beside the spine.','Glide slowly from the pelvis up toward the ribs.','Check in on pressure and breathing often.'],caution:'Avoid direct pressure on the spine. Check before working on someone with recent injury, surgery, or pregnancy.',video:''},
{id:'ql',area:'lower',name:'Side-lying quadratus lumborum work',who:'Therapist',pressure:'Light to medium',min:5,goal:'Targets the deep muscle between the ribs and pelvis.',steps:['Client lies on their side with the top knee supported by a pillow.','Find the soft space between the lowest rib and the top of the pelvis.','Use finger pads with slow, sinking pressure.','Combine with slow breathing and release gradually.'],caution:'The kidneys sit nearby, so keep pressure gentle and avoid jabbing. Stop if the client feels pain.',video:''},
{id:'sacral',area:'lower',name:'Sacral hold',who:'Therapist or partner',pressure:'Very light',min:3,goal:'A calming hold to finish lower back work.',steps:['Place one hand flat over the sacrum, the flat bone at the base of the spine.','Place the other hand on top.','Stay still and let warmth and weight do the work.','Hold for one to two minutes with slow breathing.'],caution:'Ask first. Some clients prefer not to be touched here.',video:''},
{id:'glute',area:'hips',name:'Glute compression with forearm',who:'Therapist',pressure:'Medium to firm',min:5,goal:'Eases tight glutes after sitting or training.',steps:['Client lies face down. Drape for privacy.','Place a soft forearm on the large glute muscle.','Lean in slowly and hold, then glide outward.','Work in layers, from broad to specific.'],caution:'Avoid pressing near the tailbone or the sciatic nerve line. Stop with shooting pain.',video:''},
{id:'piri',area:'hips',name:'Piriformis ball release',who:'Self-care',pressure:'Medium',min:3,goal:'Self-care for deep hip tension.',steps:['Lie on your back with knees bent and place a small ball under one glute.','Cross the ankle of that side over the opposite knee.','Let your weight sink and breathe for 30 to 60 seconds.','Roll very slightly, then switch sides.'],caution:'Stay on the muscle, not the bone. Stop with numbness or radiating pain.',video:''},
{id:'forearm',area:'arms',name:'Forearm stripping',who:'Therapist or self-care',pressure:'Medium',min:4,goal:'Helps forearms that work hard at keyboards, phones, or tools.',steps:['Rest the forearm palm up on a table or pillow.','Use your thumb to glide from the wrist toward the elbow.','Repeat with the palm down on the top of the forearm.','Add slow wrist circles to finish.'],caution:'Avoid pressing on the inside of the elbow or wrist crease. Stop with numbness or tingling.',video:''},
{id:'thenar',area:'arms',name:'Hand and thumb-base kneading',who:'Therapist or self-care',pressure:'Medium',min:3,goal:'Relieves tired hands.',steps:['Hold the hand palm up.','Use your thumbs to knead the pad at the base of the thumb.','Glide between the long bones of the hand toward the fingers.','Gently squeeze and roll each finger.'],caution:'Keep it comfortable. Check with a professional if there is swelling, heat, or joint pain.',video:''},
{id:'thigh',area:'legs',name:'Thigh effleurage and petrissage',who:'Therapist',pressure:'Light to medium',min:6,goal:'Warms and softens the big muscles of the thigh.',steps:['Use long, flat-hand strokes from the knee toward the hip.','Switch to kneading with both hands, in alternating squeezes.','Cover the front, outer and back of the thigh.','Finish with light gliding strokes.'],caution:'Avoid varicose veins and unexplained lumps. Check for recent injury.',video:''},
{id:'calf',area:'legs',name:'Calf stripping',who:'Therapist',pressure:'Medium',min:4,goal:'Eases tight calves after running, standing, or heels.',steps:['Client lies face down with the ankle supported.','Warm the calf with gentle strokes.','Use a soft fist or thumbs to glide from the ankle toward the knee.','Avoid the back of the knee.'],caution:'Do not massage a calf that is suddenly swollen, painful, warm, or red. This could be a blood clot and needs medical attention.',video:''},
{id:'pnf',area:'legs',name:'Hamstring contract-relax stretch',who:'Therapist',pressure:'Gentle stretch',min:5,goal:'Improves comfort in hamstring stretches.',steps:['Client lies face up. Lift one straight leg to a comfortable stretch.','Ask them to press the leg gently into your hand for 5 seconds.','Ask them to relax completely.','Move into the new range as they exhale, and repeat 2 to 3 times.'],caution:'Never force a stretch. Skip with acute hamstring injury.',video:''},
{id:'plantar',area:'feet',name:'Plantar thumb stripping',who:'Therapist or self-care',pressure:'Medium',min:4,goal:'Relieves tired arches and the sole of the foot.',steps:['Hold the foot firmly.','Use thumbs to glide from the heel toward the ball of the foot.','Work along each line of the sole.','Finish with slow ankle circles.'],caution:'Stay gentle on very sore heels. Seek advice for ongoing heel pain.',video:''},
{id:'footeff',area:'feet',name:'Foot effleurage and toe mobilization',who:'Therapist or self-care',pressure:'Light',min:3,goal:'A soothing finish for a leg or foot massage.',steps:['Use both hands to stroke from the toes toward the ankle.','Gently squeeze across the ball of the foot.','Roll and gently stretch each toe.','Hold the whole foot between your hands for a moment.'],caution:'Take care with diabetes, poor circulation, or numb feet, and check with a doctor first.',video:''}
];
const $=s=>document.querySelector(s);
const ls={get:(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let saved=ls.get('tb_saved',[]),myVid=ls.get('tb_vid',{});
let view='areas',area=null,q='';
const vid=t=>myVid[t.id]||t.video||'';
function parseVid(v){
  if(!v)return null;v=v.trim();
  let m=v.match(/(?:youtu\.be\/|[?&]v=|embed\/|shorts\/)([\w-]{11})/)||v.match(/^([\w-]{11})$/);
  if(m)return{k:'yt',id:m[1]};
  m=v.match(/vimeo\.com\/(?:video\/)?(\d+)/);if(m)return{k:'vm',id:m[1]};
  if(/\.(mp4|mov|webm)(\?|$)/i.test(v))return{k:'file',url:v};
  return null;
}
function thumb(t){const p=parseVid(vid(t));return p&&p.k==='yt'?'https://i.ytimg.com/vi/'+p.id+'/hqdefault.jpg':null}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function techCard(t){
  const a=AREAS.find(x=>x.id===t.area),th=thumb(t),has=!!parseVid(vid(t));
  return '<div class="tc" data-id="'+t.id+'"><div class="th" style="'+(th?'background-image:url('+th+')':'')+'">'+(th?'':a.emo)+(has?'<span class="play">▶ Video</span>':'<span class="play">Video soon</span>')+'</div><div class="tb"><h3>'+esc(t.name)+'</h3><p>'+esc(t.goal)+'</p><div class="meta"><span class="pill">'+esc(t.pressure)+'</span><span class="pill">'+t.min+' min</span><span class="pill">'+esc(t.who)+'</span></div></div></div>';
}
function bindCards(root){root.querySelectorAll('.tc').forEach(c=>c.onclick=()=>openTech(c.dataset.id))}
function setHead(title,back){$('#logo').textContent=title;$('#logo').className=back?'title':'logo';$('#back').style.display=back?'grid':'none'}
function render(){
  const m=$('#main');m.scrollTop=0;
  ['nAreas','nSaved','nAbout'].forEach(i=>$('#'+i).classList.remove('on'));
  if(view==='areas'){
    $('#nAreas').classList.add('on');setHead('Touchbook',false);
    const qq=q.trim().toLowerCase();
    let h='<input class="search" id="q" placeholder="Search techniques…" value="'+esc(q)+'">';
    if(qq){
      const r=TECH.filter(t=>(t.name+' '+t.goal).toLowerCase().includes(qq));
      h+=r.length?r.map(techCard).join(''):'<p class="empty">No techniques match.</p>';
    }else{
      h+='<p class="lead">Choose the area you want to work on.</p><div class="grid">'+AREAS.map(a=>'<button class="tile" data-a="'+a.id+'"><span class="e">'+a.emo+'</span><b>'+a.name+'</b><span class="n">'+TECH.filter(t=>t.area===a.id).length+' techniques</span></button>').join('')+'</div>';
    }
    m.innerHTML=h;
    const qi=$('#q');qi.oninput=()=>{q=qi.value;const p=qi.selectionStart;render();const n=$('#q');n.focus();n.setSelectionRange(p,p)};
    m.querySelectorAll('.tile').forEach(b=>b.onclick=()=>{area=b.dataset.a;view='area';render()});
    bindCards(m);
  }else if(view==='area'){
    $('#nAreas').classList.add('on');const a=AREAS.find(x=>x.id===area);setHead(a.name,true);
    m.innerHTML=TECH.filter(t=>t.area===area).map(techCard).join('');bindCards(m);
  }else if(view==='saved'){
    $('#nSaved').classList.add('on');setHead('Saved',false);
    const r=TECH.filter(t=>saved.includes(t.id));
    m.innerHTML=r.length?r.map(techCard).join(''):'<p class="empty">Nothing saved yet.<br>Open a technique and tap Save.</p>';bindCards(m);
  }else{
    $('#nAbout').classList.add('on');setHead('About',false);
    m.innerHTML='<div class="pb" style="padding:6px 2px"><h2>Touchbook</h2><p>A library of massage techniques organised by body area. Pick an area, open a technique and follow the video and steps.</p><h4>Please note</h4><div class="warn">General education only, not medical advice. Learn hands-on technique from a qualified instructor. Do not massage over injuries, infections, open wounds, unexplained swelling, suspected blood clots, or if a doctor has advised against it. If in doubt, check with a doctor.</div><p class="foot">Videos open inside the app. Save techniques with the Save button.</p></div>';
  }
}
function openTech(id){
  const t=TECH.find(x=>x.id===id),a=AREAS.find(x=>x.id===t.area),p=parseVid(vid(t));
  let v;
  if(p&&p.k==='yt')v='<iframe src="https://www.youtube-nocookie.com/embed/'+p.id+'?playsinline=1&rel=0" allow="accelerometer; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>';
  else if(p&&p.k==='vm')v='<iframe src="https://player.vimeo.com/video/'+p.id+'" allow="fullscreen; picture-in-picture" allowfullscreen></iframe>';
  else if(p&&p.k==='file')v='<video controls playsinline preload="metadata" src="'+esc(p.url)+'"></video>';
  else v='<div>Video coming soon</div>';
  const isS=saved.includes(id);
  $('#panel').innerHTML='<div class="vid">'+v+'</div><div class="pb"><h2>'+esc(t.name)+'</h2><div class="meta"><span class="pill">'+a.emo+' '+a.name+'</span><span class="pill">'+esc(t.pressure)+'</span><span class="pill">'+t.min+' min</span><span class="pill">'+esc(t.who)+'</span></div>'
   +'<h4>What it is for</h4><p>'+esc(t.goal)+'</p><h4>Steps</h4><ol>'+t.steps.map(s=>'<li>'+esc(s)+'</li>').join('')+'</ol><h4>Caution</h4><div class="warn">'+esc(t.caution)+' Not for acute injury, fever, infection, open wounds, or suspected blood clots. Check with a doctor if unsure.</div>'
   +(p?'':'<h4>Add a video link</h4><p class="foot">Paste a YouTube, Vimeo or .mp4 link. It is saved on this device only.</p><div class="addv"><input id="vi" placeholder="https://youtu.be/…"><button class="btn" id="vs">Add</button></div>')
   +'<div class="row"><button class="btn'+(isS?' on':'')+'" id="sv">'+(isS?'♥ Saved':'♡ Save')+'</button><button class="btn ghost" id="cl">Close</button></div></div>';
  $('#sheet').classList.add('show');$('#panel').scrollTop=0;
  $('#sv').onclick=()=>{saved=saved.includes(id)?saved.filter(x=>x!==id):saved.concat(id);ls.set('tb_saved',saved);openTech(id);if(view==='saved')render()};
  $('#cl').onclick=closeSheet;
  const vs=$('#vs');if(vs)vs.onclick=()=>{const val=$('#vi').value.trim();if(parseVid(val)){myVid[id]=val;ls.set('tb_vid',myVid);openTech(id);render()}else{$('#vi').style.borderColor='#d33'}};
}
function closeSheet(){$('#sheet').classList.remove('show');$('#panel').innerHTML=''}
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet')closeSheet()});
$('#back').onclick=()=>{view='areas';render()};
$('#nAreas').onclick=()=>{view='areas';area=null;render()};
$('#nSaved').onclick=()=>{view='saved';render()};
$('#nAbout').onclick=()=>{view='about';render()};
render();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
</html>
