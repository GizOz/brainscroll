<style>
:root{--acc:#ee5a24;--acc2:#ff8a4c;--ink:#1d1a17;--mute:#7b726b;--card:#fff;--line:#f0e2d9;--h:20}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;background:#fbe9df;color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif}
body{background:linear-gradient(180deg,#fcebe2 0%,#f7ece6 45%,#efe9e5 100%)}
#app{height:100dvh;display:flex;flex-direction:column;max-width:560px;margin:0 auto;position:relative;padding-top:env(safe-area-inset-top)}
header{display:flex;align-items:center;justify-content:space-between;padding:10px 18px 6px}
.logo{font-family:"New York",ui-serif,Georgia,serif;font-weight:700;font-size:30px;letter-spacing:-.5px;color:var(--acc)}
.circ{width:42px;height:42px;border-radius:50%;background:#fff;border:1px solid var(--line);display:grid;place-items:center;color:var(--acc);cursor:pointer;position:relative}
.circ svg{width:20px;height:20px}
.dot{position:absolute;top:8px;right:9px;min-width:8px;height:8px;border-radius:8px;background:var(--acc)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:6px 18px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:#fff;color:var(--ink);padding:8px 15px;border-radius:999px;font:600 13.5px -apple-system,Inter,sans-serif;cursor:pointer}
.chip.on{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border-color:transparent}
#feed{flex:1;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
#feed::-webkit-scrollbar{display:none}
.card{height:100%;scroll-snap-align:start;scroll-snap-stop:always;padding:2px 14px 12px}
.face{position:relative;height:100%;border-radius:30px;overflow:hidden;background:linear-gradient(160deg,hsl(var(--h) 80% 62%),hsl(calc(var(--h) + 25) 70% 42%));box-shadow:0 10px 30px rgba(120,60,30,.18);color:#fff}
.bg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity .6s}
.bg.on{opacity:1}
.ico{position:absolute;top:22%;left:0;right:0;text-align:center;font-size:84px;opacity:.9}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.28) 0%,rgba(0,0,0,0) 22%,rgba(0,0,0,0) 38%,rgba(10,6,4,.82) 100%)}
.tag{position:absolute;top:16px;left:16px;background:rgba(255,255,255,.22);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:6px 12px;border-radius:999px;font:700 12px -apple-system,sans-serif;letter-spacing:.6px;text-transform:uppercase}
.credit{position:absolute;top:22px;right:16px;font-size:10.5px;opacity:.75}
.text{position:absolute;left:0;right:70px;bottom:0;padding:0 18px calc(104px + env(safe-area-inset-bottom)) 20px}
h2{font-family:"New York",ui-serif,Georgia,serif;font-weight:700;font-size:clamp(26px,7.4vw,34px);line-height:1.12;margin-bottom:10px;text-shadow:0 2px 14px rgba(0,0,0,.35)}
.body{font-size:15.5px;line-height:1.45;opacity:.96;margin-bottom:10px;text-shadow:0 1px 8px rgba(0,0,0,.35)}
.why{font-size:13.5px;line-height:1.4;opacity:.9}
.why b{color:#ffc8a8}
.acts{position:absolute;right:12px;bottom:calc(112px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;align-items:center}
.act{display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;color:#fff;font:600 11px -apple-system,sans-serif;cursor:pointer;text-decoration:none}
.act i{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.2);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:grid;place-items:center}
.act svg{width:22px;height:22px}
.act.on i{background:var(--acc)}
.act.on svg{fill:#fff}
nav{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));display:flex;gap:10px;padding:8px;border-radius:999px;background:rgba(255,255,255,.55);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.7);box-shadow:0 8px 24px rgba(120,60,30,.18);z-index:5}
nav button{width:50px;height:50px;border-radius:50%;border:0;background:rgba(255,255,255,.75);color:#5a4f48;display:grid;place-items:center;cursor:pointer}
nav button svg{width:22px;height:22px}
nav button.on{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff}
#saved{flex:1;overflow-y:auto;padding:6px 18px 120px;display:none}
.s{background:#fff;border:1px solid var(--line);border-radius:22px;padding:16px;margin-bottom:12px;display:flex;gap:12px}
.s .th{flex:none;width:64px;height:64px;border-radius:16px;background:#f3d9cb center/cover;display:grid;place-items:center;font-size:28px}
.s .tg{font:700 11px sans-serif;letter-spacing:.6px;text-transform:uppercase;color:var(--acc);margin-bottom:4px}
.s h3{font-family:"New York",ui-serif,Georgia,serif;font-size:18px;line-height:1.25;margin-bottom:6px}
.s p{font-size:14px;line-height:1.45;color:#5c524b}
.s button{margin-top:8px;background:none;border:0;color:var(--mute);font:13px sans-serif;cursor:pointer;padding:0}
.empty{color:var(--mute);text-align:center;margin-top:90px;line-height:1.6}
.endc{display:grid;place-items:center;height:100%}
.endc .box{background:#fff;border-radius:28px;padding:28px;text-align:center;margin:0 14px;box-shadow:0 10px 30px rgba(120,60,30,.12)}
.endc h2{color:var(--ink);text-shadow:none;font-size:26px}
.endc p{color:var(--mute);margin-bottom:16px;font-size:15px}
.btn{border:0;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;font:700 15px -apple-system,sans-serif;padding:13px 22px;border-radius:999px;cursor:pointer}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.sheet{position:fixed;inset:0;background:rgba(30,18,10,.45);display:none;align-items:flex-end;justify-content:center;z-index:20}
.sheet.show{display:flex}
.panel{background:#fff;width:100%;max-width:560px;border-radius:30px 30px 0 0;padding:22px 22px calc(26px + env(safe-area-inset-bottom));max-height:86dvh;overflow:auto}
.panel h3{font-family:"New York",ui-serif,Georgia,serif;font-size:24px;margin-bottom:6px}
.panel p{color:var(--mute);font-size:14px;line-height:1.5;margin-bottom:14px}
.panel label{display:block;font:700 12px sans-serif;letter-spacing:.5px;text-transform:uppercase;color:var(--mute);margin:12px 0 6px}
.panel input,.panel select{width:100%;padding:13px 14px;border-radius:14px;border:1px solid var(--line);background:#fdf8f5;font:16px -apple-system,sans-serif;color:var(--ink)}
.row{display:flex;gap:10px;margin-top:18px}
.morebody{white-space:pre-wrap;font-size:16px;line-height:1.55;color:#3b332d}
.spin{display:inline-block;width:14px;height:14px;border:2px solid #d9c2b5;border-top-color:var(--acc);border-radius:50%;animation:r .7s linear infinite;vertical-align:-2px;margin-right:8px}
@keyframes r{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 70px);transform:translateX(-50%);background:#1d1a17;color:#fff;padding:10px 16px;border-radius:999px;font-size:13.5px;z-index:30;opacity:0;pointer-events:none;transition:.25s;max-width:88vw;text-align:center}
.toast.show{opacity:1}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo">Brainscroll</div>
    <div class="circ" id="btnFresh" title="Fresh facts"></div>
  </header>
  <div class="chips" id="chips"></div>
  <main id="feed"></main>
  <section id="saved"></section>
  <nav>
    <button id="tFeed" class="on" aria-label="Feed"></button>
    <button id="tSaved" aria-label="Saved"></button>
    <button id="tSettings" aria-label="Settings"></button>
  </nav>
</div>

<div class="sheet" id="sheetSet"><div class="panel">
  <h3>Settings</h3>
  <p>Free by default: new facts and photos come from Wikipedia, no account needed. Optional: add your own Anthropic API key to get facts written by Claude instead. The key stays on this phone and is only sent to Anthropic.</p>
  <label>Anthropic API key (optional)</label>
  <input id="inKey" type="password" placeholder="sk-ant-…" autocomplete="off" autocapitalize="off" spellcheck="false">
  <label>Model</label>
  <select id="inModel">
    <option value="claude-haiku-5-5">Claude Haiku 5.5 (fast, cheapest)</option>
    <option value="claude-sonnet-5-5">Claude Sonnet 5.5 (better writing)</option>
  </select>
  <div class="row"><button class="btn" id="setSave">Save</button><button class="btn ghost" id="setClose">Close</button></div>
  <div class="row"><button class="btn ghost" id="setClear">Clear saved &amp; generated facts</button></div>
</div></div>

<div class="sheet" id="sheetMore"><div class="panel">
  <h3 id="moreTitle"></h3>
  <div class="morebody" id="moreBody"></div>
  <div class="row"><button class="btn ghost" id="moreClose">Close</button></div>
</div></div>

<div class="toast" id="toast"></div>

<script>
const IC={
 home:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
 heart:'<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z"/>',
 spark:'<path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 16l.7 1.8L21.5 18.5l-1.8.7L19 21l-.7-1.8-1.8-.7 1.8-.7z"/>',
 sliders:'<path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h12M20 18h0"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="18" cy="18" r="2"/>',
 chat:'<path d="M21 12a8 8 0 0 1-11.6 7.1L3 21l1.9-6.2A8 8 0 1 1 21 12z"/>',
 ext:'<path d="M14 4h6v6M10 14L20 4M20 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h5"/>'
};
const svg=n=>'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+IC[n]+'</svg>';

const CATS={Trending:12,Brain:340,Body:355,Food:25,Money:150,Tech:215,Culture:280,Travel:185,Animals:110,Science:245,History:38,Language:320};
const EMO={Trending:'🔥',Brain:'🧠',Body:'🫀',Food:'🍜',Money:'💰',Tech:'📱',Culture:'🎬',Travel:'🧭',Animals:'🐙',Science:'🔭',History:'🏛️',Language:'🗣️'};
const SEED=[
["Brain","You can't tickle yourself","Your brain predicts the sensation of your own movements and dampens it. Someone else's touch is unpredictable, so it still gets through.","Fun fact: you literally can't tickle yourself. Your brain cancels it out.","Tickling"],
["Brain","Each of your eyes has a blind spot","Where the optic nerve leaves the eye there are no light sensors. You never notice because your brain quietly fills the gap with a guess.","Right now your brain is making up a small part of what you see.","Blind spot (vision)"],
["Brain","Once you learn a word, you see it everywhere","It's called the frequency illusion (often nicknamed Baader-Meinhof). The thing wasn't suddenly more common, you just started noticing it.","Ever learn something new and then see it three times in one week? That's a real effect.","Frequency illusion"],
["Brain","Nobody notices your outfit as much as you think","In a well-known study, students wore an embarrassing T-shirt and guessed about half of the room noticed. Only about a quarter did.","Relax about that stain. Studies say people notice about half as much as you fear.","Spotlight effect"],
["Brain","The more you hear a song, the more you like it","Psychologists call it the mere-exposure effect: familiarity alone makes us warmer toward people, songs and logos.","That's why a song you hated in week one is your favourite by week four.","Mere-exposure effect"],
["Brain","Unfinished things stay stuck in your head","The Zeigarnik effect: we tend to remember interrupted tasks better than completed ones. Open loops keep nagging at us.","That's why cliffhangers work, and why your to-do list never leaves you alone.","Zeigarnik effect"],
["Brain","We remember the peak and the end","The peak-end rule: we judge an experience mostly by its most intense moment and how it ended, not by its average or length.","A great last 10 minutes can save a mediocre trip. Always end on a high.","Peak–end rule"],
["Body","You're taller in the morning","The discs in your spine compress through the day, so you can lose around a centimetre or two by evening and regain it overnight.","You're literally taller right after waking up.","Intervertebral disc"],
["Body","Goosebumps are a leftover from fur","Tiny muscles pull each hair upright. In furry ancestors that made them look bigger or kept them warm. In us it does almost nothing.","Goosebumps are basically a feature for a fur coat we don't have anymore.","Goose bumps"],
["Body","Your nose runs when you cry","Tears drain through small ducts into the nose, which is why crying gives you a runny nose.","Your tears and your runny nose are the same fluid, just taking different exits.","Tears"],
["Body","Your brain burns about 20% of your energy","It's around 2% of your body weight but uses roughly a fifth of the energy you burn at rest.","Feeling drained after a day of thinking is real: your brain is the most expensive organ you own.","Human brain"],
["Food","Ketchup was once sold as medicine","In the 1830s, a doctor marketed tomato ketchup pills as a cure for stomach complaints.","Ketchup started out as a remedy, not a topping.","Ketchup"],
["Food","Fortune cookies aren't really Chinese","They're generally traced to Japanese-American bakeries in California in the early 1900s and were popularised by Chinese-American restaurants.","Fun one for your next Chinese dinner: you won't find fortune cookies in China.","Fortune cookie"],
["Food","Coffee beans are not beans","They're the seeds of the coffee cherry, a small fruit. They're called beans because of their shape.","Technically your morning coffee is a fruit seed.","Coffee bean"],
["Food","Most 'wasabi' isn't wasabi","Real wasabi is rare and costly. The green paste at many sushi places is horseradish with mustard and colouring.","Next sushi night: that green stuff is probably horseradish.","Wasabi"],
["Food","Espresso isn't a type of bean","It's a way of making coffee: hot water forced through finely ground coffee under pressure. Any roast can be used.","Espresso is a method, not a bean. Many people mix that up.","Espresso"],
["Food","Honey barely spoils","Low water content and acidity make it hostile to microbes. Sealed honey from ancient Egyptian tombs was still preserved thousands of years later.","Honey is one of the few foods that essentially never goes off.","Honey"],
["Food","Bananas are slightly radioactive","They contain potassium, and a tiny fraction of natural potassium is radioactive. The dose is far too small to matter.","Every banana you eat is mildly radioactive. Totally harmless, but a great party fact.","Banana"],
["Money","The Rule of 72","Divide 72 by a yearly return to estimate how many years it takes money to double. At 6% it's about 12 years, at 9% about 8.","Quick trick: 72 divided by the interest rate tells you how fast money doubles.","Compound interest"],
["Money","Why prices end in .99","The left-digit effect: we read $9.99 as '9 dollars and something', not 'nearly 10', so it feels meaningfully cheaper.","$9.99 vs $10 is only one cent, but your brain treats it like a whole dollar.","Psychological pricing"],
["Money","The first number you hear sticks","Anchoring: an early number, even a random one, pulls later estimates toward it. It's why the first price in a negotiation matters so much.","If you're negotiating, say the first number. It anchors everything after it.","Anchoring effect"],
["Money","The decoy effect","Add a clearly worse third option and people shift toward the one it makes look better. Subscription pricing pages use this a lot.","Ever wonder why there's a weird middle plan? It's there to make the big one look smart.","Decoy effect"],
["Money","We love what we build ourselves","The IKEA effect: people value things more when they helped make them, even if the result is mediocre.","That's why the shelf you built feels better than a nicer one you bought.","IKEA"],
["Money","Einstein probably never said that about compound interest","The famous line calling compound interest the eighth wonder of the world has no solid evidence behind it.","Fun myth-buster: that Einstein compound interest quote probably isn't his.","Compound interest"],
["Money","Work expands to fill the time you give it","Parkinson's law: give yourself a week for a task and it will somehow take a week. Give it a day and often it fits.","Want to finish faster? Shorten the deadline.","Parkinson's law"],
["Money","When a measure becomes a target, it breaks","Goodhart's law: people optimise the number instead of the thing it was meant to measure.","That's why chasing likes or KPIs often makes things worse, not better.","Goodhart's law"],
["Tech","The first webcam watched a coffee pot","In 1991, Cambridge researchers pointed a camera at their office coffee pot so colleagues could check if it was full before walking over.","The first live webcam on the internet was for checking whether the coffee was ready.","Trojan Room coffee pot"],
["Tech","Bluetooth is named after a Viking king","Harald 'Bluetooth' Gormsson united parts of Denmark and Norway. The logo merges his initials in Viking runes.","Your headphones are named after a Viking king who united tribes.","Bluetooth"],
["Tech","Wi-Fi doesn't stand for anything","It's often said to mean 'wireless fidelity', but it was just a catchy brand name chosen by a marketing agency.","Plot twist: Wi-Fi isn't short for anything.","Wi-Fi"],
["Tech","Your phone out-computes Apollo by millions","The Apollo Guidance Computer had around 4 KB of working memory. A modern phone has millions of times more.","We went to the Moon with less computing power than your phone's calculator.","Apollo Guidance Computer"],
["Tech","The word 'robot' is Czech","It comes from a 1920 play by Karel Čapek. 'Robota' means forced labour.","'Robot' literally comes from a Czech word for hard labour.","Robot"],
["Tech","The first computer 'bug' was a real moth","In 1947 a moth got stuck in a Harvard computer and was taped into the logbook. The term 'bug' was already used, but this made it famous.","The first computer bug was a literal bug.","Software bug"],
["Culture","The first YouTube video is 19 seconds long","'Me at the zoo' was uploaded on 23 April 2005. It shows a co-founder standing in front of elephants at a zoo.","The very first YouTube video is 19 seconds of someone talking about elephants.","Me at the zoo"],
["Culture","Netflix began by mailing DVDs","It launched in 1997 as a DVD-by-mail rental service. Streaming only started in 2007.","Netflix is basically a DVD mailing company that outlived everyone.","Netflix"],
["Culture","The Mona Lisa became famous because it was stolen","It was stolen from the Louvre in 1911 and found in 1913. The huge press coverage turned it into a global icon.","The Mona Lisa got famous partly because someone stole it.","Mona Lisa"],
["Culture","'Emoji' has nothing to do with 'emotion'","It's Japanese: 'e' (picture) plus 'moji' (character). The first set was created in Japan in 1999.","Emoji isn't from 'emotion', it just means 'picture character'.","Emoji"],
["Culture","Lego bricks from 1958 still fit today","The modern brick design dates from 1958, and bricks from then still connect with new ones.","Lego bricks from your grandparents' era still click with today's.","Lego"],
["Culture","Barbie has a full name","Barbie's full name in the official story is Barbara Millicent Roberts, from a fictional town in Wisconsin.","Barbie's real name is Barbara Millicent Roberts.","Barbie"],
["Travel","France has the most time zones in the world","Counting its overseas territories, France spans 12 time zones, more than any other country.","Tiny France actually covers more time zones than Russia.","Time in France"],
["Travel","You can float in the Dead Sea","Its shore is about 430 metres below sea level, the lowest land on Earth, and the water is so salty you float effortlessly.","The Dead Sea is the lowest dry land on Earth, and you can't sink in it.","Dead Sea"],
["Travel","The Eiffel Tower grows in summer","Heat expands the iron, so the tower can be about 15 centimetres taller on a hot day.","The Eiffel Tower is taller in summer.","Eiffel Tower"],
["Travel","Finland has about one sauna for every two people","Roughly 3 million saunas for about 5.5 million people. They're in homes, offices and apartment blocks.","In Finland even office buildings have saunas.","Sauna"],
["Travel","Venice is built on wooden piles","Buildings stand on wooden piles driven deep into the mud. Because they stay underwater, they harden rather than rot.","Venice is basically a city standing on a forest turned upside down.","Venice"],
["Animals","Octopuses have three hearts","Two pump blood to the gills, one to the body. Their blood is blue because it uses copper to carry oxygen.","Octopuses have three hearts and blue blood.","Octopus"],
["Animals","Cows have best friends","Studies suggest cows form preferred friendships and show lower stress when kept near their favourites.","Cows get stressed when separated from their best friend.","Cattle"],
["Animals","Sea otters hold hands when they sleep","They float in groups called rafts and hold paws so they don't drift apart.","Sea otters hold hands while sleeping so they don't float away.","Sea otter"],
["Animals","A group of flamingos is a flamboyance","It's the official collective noun, and it fits.","A group of flamingos is called a flamboyance.","Flamingo"],
["Animals","Sharks are older than trees","Sharks date back around 450 million years. The first trees appeared roughly 350 to 390 million years ago.","Sharks have been around longer than trees.","Shark"],
["Animals","Crows remember faces","Studies at the University of Washington found crows recognise people who threatened them, and other crows learn to scold those people too.","Crows can hold a grudge against your face.","Crow"],
["Animals","Wombats make cube-shaped poop","The shape forms in their intestines, and wombats stack the cubes to mark territory.","Wombats are the only animals that make cube-shaped poop.","Wombat"],
["Science","The Sun you see is 8 minutes old","Sunlight takes about 8 minutes and 20 seconds to reach Earth, so you're always seeing the Sun as it was a few minutes ago.","If the Sun vanished, you wouldn't know for 8 minutes.","Sun"],
["Science","A day on Venus is longer than its year","Venus rotates once every ~243 Earth days but orbits the Sun in ~225. It also spins backwards.","On Venus a day lasts longer than a year.","Venus"],
["Science","Hot water might freeze faster than cold","The Mpemba effect is reported in some experiments, but scientists still disagree about whether and why it happens.","Scientists are still arguing about whether hot water freezes faster than cold.","Mpemba effect"],
["Science","Astronauts say space smells like burnt steak","After spacewalks, astronauts have described the smell on their suits as seared steak, hot metal or welding.","Space apparently smells like burnt steak, according to astronauts.","Outer space"],
["Science","A teaspoon of neutron star weighs billions of tons","Neutron star matter is so dense that a teaspoon would weigh billions of tons on Earth.","A teaspoon of a neutron star weighs more than all humans combined.","Neutron star"],
["History","Oxford is older than the Aztec Empire","Teaching at Oxford is documented from around 1096. The Aztec city of Tenochtitlan was founded in 1325.","Oxford University is older than the Aztec Empire.","University of Oxford"],
["History","Cleopatra lived closer to the Moon landing than to the Great Pyramid","The Great Pyramid was built around 2560 BCE. Cleopatra lived about 2,500 years later, and the Moon landing came about 2,000 years after her.","Cleopatra lived closer in time to the Moon landing than to the building of the Great Pyramid.","Great Pyramid of Giza"],
["History","The shortest war lasted under an hour","The Anglo-Zanzibar War of 27 August 1896 ended after roughly 40 minutes.","The shortest war in history lasted less than an hour.","Anglo-Zanzibar War"],
["History","Vikings didn't wear horned helmets","There's no good evidence they did. The image comes largely from 19th-century art and opera costumes.","Vikings never wore horned helmets. That was invented later.","Horned helmet"],
["History","The Great Wall isn't visible from space","It's long but narrow, and it blends into its surroundings. Astronauts say it's very hard or impossible to see with the naked eye from orbit.","The 'visible from space' claim about the Great Wall is a myth.","Great Wall of China"],
["History","Napoleon wasn't actually short","He was around 1.68 to 1.70 metres, about average for a Frenchman of his time. The myth was boosted by British caricatures and unit confusion.","Napoleon wasn't short. That's a myth.","Napoleon complex"],
["Language","'OK' began as a joke in 1839","It started in Boston as a humorous abbreviation of the misspelling 'oll korrect' and spread after a political campaign picked it up.","'OK' started as a joke abbreviation of a deliberate misspelling.","OK"],
["Language","Hebrew came back from the dead","It stopped being an everyday spoken language long ago, but was revived as a mother tongue in the late 19th and 20th centuries.","Hebrew is one of the only languages ever revived as a national mother tongue.","Hebrew language"],
["Language","'Quarantine' means forty days","It comes from the Italian 'quaranta giorni'. Venice required ships to wait offshore for 40 days during plague outbreaks.","'Quarantine' literally means 'forty days' in Italian.","Quarantine"]
].map(a=>({cat:a[0],title:a[1],body:a[2],why:a[3],wiki:a[4]}));

const $=s=>document.querySelector(s);
const feed=$('#feed'),chips=$('#chips'),savedEl=$('#saved');
const ls={get:(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let S=ls.get('bs_settings',{key:'',model:'claude-haiku-5-5'});
let saved=ls.get('bs_saved',[]), gen=ls.get('bs_gen',[]).filter(x=>x&&x.title&&CATS[x.cat]!==undefined);
let imgCache=ls.get('bs_img',{});
let cat='Mix', loading=false, autoOff=false, items;
const key=i=>i.title.toLowerCase();
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
items=shuffle(SEED.concat(gen));
const isSaved=i=>saved.some(s=>key(s)===key(i));
const visible=()=>cat==='Mix'?items:items.filter(i=>i.cat===cat);

function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),2600)}

/* ---------- Claude API (own key) ---------- */
async function claude(prompt,max){
  if(!S.key){const e=new Error('nokey');e.code='nokey';throw e}
  const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',
    headers:{'content-type':'application/json','x-api-key':S.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:S.model,max_tokens:max||1600,messages:[{role:'user',content:prompt}]})});
  if(!r.ok){let m='';try{m=(await r.json()).error.message}catch(e){}const e=new Error(m||('HTTP '+r.status));e.code=r.status;throw e}
  const j=await r.json();return (j.content||[]).map(c=>c.text||'').join('');
}

/* ---------- Real photos from Wikipedia ---------- */
async function wikiImage(title){
  if(!title)return null;
  if(title in imgCache)return imgCache[title]||null;
  try{
    const r=await fetch('https://en.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(title.replace(/ /g,'_'))+'?redirect=true');
    if(!r.ok)throw 0;
    const j=await r.json();
    let u=j.thumbnail&&j.thumbnail.source;
    if(u)u=u.replace(/\/(\d+)px-/,'/960px-');
    imgCache[title]=u||0;ls.set('bs_img',imgCache);return u||null;
  }catch(e){return null}
}
async function paintImage(card){
  const it=card.__item;if(!it||card.__img)return;card.__img=true;if(it.noimg)return;
  let u=it.img||await wikiImage(it.wiki);if(!u)return;u=u.replace('/900px-','/960px-');
  const bg=card.querySelector('.bg'),pre=new Image();
  pre.onload=()=>{bg.style.backgroundImage='url("'+u+'")';bg.classList.add('on');card.querySelector('.ico').style.display='none';card.querySelector('.credit').textContent='Photo: Wikipedia'};
  pre.onerror=()=>{if(/\/960px-/.test(pre.src)&&!pre.__r){pre.__r=1;u=u.replace('/960px-','/500px-');pre.src=u}};pre.src=u;
}

/* ---------- Cards ---------- */
function cardEl(it){
  const d=document.createElement('article');d.className='card';
  d.innerHTML='<div class="face"><div class="bg"></div><div class="ico"></div><div class="shade"></div><div class="tag"></div><div class="credit"></div>'
   +'<div class="text"><h2></h2><p class="body"></p><p class="why"><b>Say it · </b><span></span></p></div>'
   +'<div class="acts"><button class="act sv"><i>'+svg('heart')+'</i><span>Save</span></button><button class="act mr"><i>'+svg('chat')+'</i><span>More</span></button><a class="act ph" target="_blank" rel="noopener"><i>'+svg('ext')+'</i><span>Photos</span></a></div></div>';
  d.querySelector('.face').style.setProperty('--h',CATS[it.cat]??25);
  d.querySelector('.ico').textContent=EMO[it.cat]||'✨';
  d.querySelector('.tag').textContent=it.cat;
  d.querySelector('h2').textContent=it.title;
  d.querySelector('.body').textContent=it.body;
  d.querySelector('.why span').textContent=it.why||'';
  d.querySelector('.ph').href='https://www.google.com/search?tbm=isch&q='+encodeURIComponent(it.title);
  const sv=d.querySelector('.sv'),paint=()=>sv.classList.toggle('on',isSaved(it));paint();
  sv.onclick=()=>{if(isSaved(it))saved=saved.filter(s=>key(s)!==key(it));else saved.push(it);ls.set('bs_saved',saved);paint();badge()};
  d.querySelector('.mr').onclick=()=>openMore(it);
  d.__item=it;return d;
}
function endEl(){
  const d=document.createElement('article');d.className='card endc';d.id='end';
  d.innerHTML='<div class="box"><h2>You\'ve seen them all</h2><p></p><button class="btn" id="endBtn"></button></div>';
  d.querySelector('p').textContent='Fetching more for you…';
  const b=d.querySelector('#endBtn');b.textContent='✨ Fresh facts';
  b.onclick=()=>loadMore(true);
  return d;
}
let io;
function render(){
  feed.innerHTML='';visible().forEach(i=>feed.appendChild(cardEl(i)));feed.appendChild(endEl());feed.scrollTop=0;observe();
  const f=feed.querySelector('.card');if(f&&f.__item)paintImage(f);
}
function observe(){
  if(io)io.disconnect();
  io=new IntersectionObserver(es=>es.forEach(e=>{
    if(!e.isIntersecting)return;const c=e.target;if(!c.__item)return;
    paintImage(c);
    const cs=[...feed.querySelectorAll('.card:not(.endc)')],idx=cs.indexOf(c);
    for(let k=idx+1;k<=idx+2&&k<cs.length;k++)paintImage(cs[k]);
    if(cs.length-idx<=3)loadMore(false);
  }),{root:feed,threshold:.6});
  feed.querySelectorAll('.card').forEach(c=>io.observe(c));
}

/* ---------- Fresh facts ---------- */
async function loadMore(manual){
  if(manual)autoOff=false;
  if(loading||(autoOff&&!manual))return;
  if(!S.key)return loadWiki(manual);
  loading=true;const eb=$('#endBtn');if(eb&&manual){eb.innerHTML='<span class="spin"></span>Writing…';eb.disabled=true}
  $('#btnFresh').style.opacity=.5;
  const have=items.map(i=>i.title).slice(-60).join('; ');
  const cats=Object.keys(CATS).filter(c=>c!=='Trending');
  const topic=cat==='Mix'||cat==='Trending'?'a varied mix of: '+cats.join(', '):cat;
  const prompt='Write 8 cards of conversation-worthy facts a person can drop into small talk with friends or at dinner. Topic: '+topic+'.\n'
   +'Make them trendy, popular, unique and surprising, things people will want to repeat: everyday life, food, money psychology, tech and internet culture, pop culture, travel, animals, body and brain. Avoid dry textbook trivia and the most overused facts. Only well-established facts you are confident about; no invented statistics or studies; if something is debated, say so. Do not repeat: '+have+'.\n'
   +'Return ONLY a JSON array of 8 objects with keys: cat (one of '+cats.join('|')+'), title (max 9 words, a hook), body (1-2 sentences, max 40 words), say (one natural sentence a person could say out loud to start the conversation, max 24 words), wiki (exact title of an English Wikipedia article about an object, animal, place, food or concept that illustrates it; never a living person). English only.';
  try{
    const txt=await claude(prompt,1800);
    const m=txt.match(/\[[\s\S]*\]/);const arr=m?JSON.parse(m[0]):[];
    const have2=new Set(items.map(key));
    const fresh=arr.filter(x=>x&&x.title&&x.body&&CATS[x.cat]!==undefined&&!have2.has(key(x))).map(x=>({cat:x.cat,title:String(x.title),body:String(x.body),why:String(x.say||x.why||''),wiki:x.wiki?String(x.wiki):''}));
    if(fresh.length){
      items.push(...fresh);gen.push(...fresh);ls.set('bs_gen',gen.slice(-200));
      const end=$('#end');
      fresh.filter(i=>cat==='Mix'||i.cat===cat).forEach(i=>{const el=cardEl(i);feed.insertBefore(el,end);io.observe(el)});
      if(manual)toast(fresh.length+' new facts added');
    }
  }catch(e){
    autoOff=true;
    if(e.code==='nokey')toast('Add your API key in Settings');
    else if(e.code===401)toast('API key was rejected. Check it in Settings.');
    else if(e.code===429)toast('Rate limited. Try again in a minute.');
    else if(manual||!navigator.onLine)toast(navigator.onLine?'Could not load fresh facts':'You are offline');
  }
  loading=false;$('#btnFresh').style.opacity=1;
  const b=$('#endBtn');if(b){b.disabled=false;b.textContent='✨ Fresh facts'}
}


/* ---------- Free mode: Wikipedia ---------- */
async function wikiFeed(have){
  const out=[];
  const add=o=>{if(o&&o.title&&!have.has(key(o))){have.add(key(o));out.push(o)}};
  const clip=t=>{t=(t||'').replace(/\s+/g,' ').trim();if(t.length<=250)return t;const c=t.slice(0,250),i=c.lastIndexOf('. ');return i>110?c.slice(0,i+1):c.replace(/\s+\S*$/,'')+'…'};
  const cap=t=>t?t.charAt(0).toUpperCase()+t.slice(1):'';
  const big=u=>u.replace(/\/(\d+)px-/,'/960px-');
  const person=t=>/\(born\s|\(\d{3,4}\s*[–—-]\s*\d{3,4}\)|\bborn\b/i.test((t||'').slice(0,160));
  const skip=/^(Main_Page|Special:|Wikipedia:|Portal:|Help:|File:|Category:|List_of|Deaths_in|\d{4}_in_)/;
  const fmt=n=>n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?Math.round(n/1e3)+'K':String(n);
  // Trending: most-read Wikipedia articles (yesterday), a good proxy for what people are talking about
  for(const back of [1,2]){
    try{
      const d=new Date(Date.now()-back*864e5),y=d.getUTCFullYear(),m=String(d.getUTCMonth()+1).padStart(2,'0'),dd=String(d.getUTCDate()).padStart(2,'0');
      const r=await fetch('https://en.wikipedia.org/api/rest_v1/feed/featured/'+y+'/'+m+'/'+dd);
      if(!r.ok)continue;
      const j=await r.json();
      const arts=((j.mostread&&j.mostread.articles)||[]).filter(a=>a&&a.title&&!skip.test(a.title)&&a.type==='standard'&&a.extract&&a.extract.length>=80).slice(0,40);
      arts.sort(()=>Math.random()-.5).slice(0,6).forEach(a=>{
        const t=a.title.replace(/_/g,' '),isP=person(a.extract);
        add({cat:'Trending',title:'Trending now: '+t,body:clip(a.extract),why:fmt(a.views)+' people looked this up yesterday. Ask a friend if they have heard about it.',wiki:a.title,img:(!isP&&a.thumbnail)?big(a.thumbnail.source):'',noimg:!!(isP||!a.thumbnail)});
      });
      if(out.length)break;
    }catch(e){}
  }
  return out;
}
async function loadWiki(manual){
  loading=true;$('#btnFresh').style.opacity=.5;
  const eb=$('#endBtn');if(eb&&manual){eb.innerHTML='<span class="spin"></span>Loading…';eb.disabled=true}
  try{
    const fresh=await wikiFeed(new Set(items.map(key)));
    if(fresh.length){
      items.push(...fresh);gen.push(...fresh);ls.set('bs_gen',gen.slice(-200));
      const end=$('#end');
      fresh.filter(i=>cat==='Mix'||i.cat===cat).forEach(i=>{const el=cardEl(i);feed.insertBefore(el,end);io.observe(el)});
      if(manual)toast(fresh.length+' new facts added');
    }else{if(!manual)autoOff=true;else toast('Nothing new right now, try again')}
  }catch(e){autoOff=true;if(manual)toast(navigator.onLine?'Could not load more':'You are offline')}
  loading=false;$('#btnFresh').style.opacity=1;
  const b=$('#endBtn');if(b){b.disabled=false;b.textContent='✨ Fresh facts'}
}

/* ---------- More ---------- */
async function openMore(it){
  $('#moreTitle').textContent=it.title;const b=$('#moreBody');$('#sheetMore').classList.add('show');
  if(it.more){b.textContent=it.more;return}
  if(!S.key){
    b.innerHTML='<span class="spin"></span>Loading…';
    try{const r=await fetch('https://en.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent((it.wiki||it.title).replace(/ /g,'_')));const j=await r.json();it.more=(j.extract||'No more detail available.')+'\n\nSource: Wikipedia';b.textContent=it.more}catch(e){b.textContent='Could not load more right now.'}
    return;
  }
  b.innerHTML='<span class="spin"></span>Thinking…';
  try{
    const t=await claude('Expand this fact in 90-120 words of plain text, no markdown: a bit more context, one genuinely interesting detail, and one practical way to use the idea. If you are unsure about a detail, leave it out.\n\nFact: '+it.title+'. '+it.body,600);
    it.more=t.trim();b.textContent=it.more;
  }catch(e){b.textContent=e.code===401?'API key was rejected. Check it in Settings.':'Could not load more right now.'}
}

/* ---------- Chips, tabs, saved, settings ---------- */
function renderChips(){
  chips.innerHTML='';['Mix',...Object.keys(CATS)].forEach(c=>{
    const b=document.createElement('button');b.className='chip'+(c===cat?' on':'');b.textContent=c;
    b.onclick=()=>{cat=c;renderChips();render()};chips.appendChild(b)});
}
function badge(){$('#tSaved').innerHTML=svg('heart')+(saved.length?'<span class="dot" style="position:relative;display:none"></span>':'')}
function renderSaved(){
  savedEl.innerHTML='';
  if(!saved.length){savedEl.innerHTML='<p class="empty">Nothing saved yet.<br>Tap the heart on a fact to keep it here.</p>';return}
  saved.slice().reverse().forEach(it=>{
    const d=document.createElement('div');d.className='s';
    d.innerHTML='<div class="th"></div><div><div class="tg"></div><h3></h3><p></p><button>Remove</button></div>';
    const th=d.querySelector('.th');th.textContent=EMO[it.cat]||'✨';
    const tu=it.img||(it.wiki&&imgCache[it.wiki]);if(tu){th.textContent='';th.style.backgroundImage='url("'+tu+'")'}
    d.querySelector('.tg').textContent=it.cat;d.querySelector('h3').textContent=it.title;d.querySelector('p').textContent=it.body;
    d.querySelector('button').onclick=()=>{saved=saved.filter(s=>key(s)!==key(it));ls.set('bs_saved',saved);renderSaved()};
    savedEl.appendChild(d);
  });
}
function show(t){
  const f=t==='feed';feed.style.display=f?'':'none';chips.style.display=f?'':'none';savedEl.style.display=f?'none':'block';
  $('#tFeed').classList.toggle('on',f);$('#tSaved').classList.toggle('on',!f);
  if(!f)renderSaved();
}
$('#tFeed').innerHTML=svg('home');$('#tSettings').innerHTML=svg('sliders');$('#btnFresh').innerHTML=svg('spark');badge();
$('#tFeed').onclick=()=>show('feed');$('#tSaved').onclick=()=>show('saved');
$('#btnFresh').onclick=()=>{show('feed');loadMore(true)};
function openSet(){$('#inKey').value=S.key||'';$('#inModel').value=S.model||'claude-haiku-5-5';$('#sheetSet').classList.add('show')}
$('#tSettings').onclick=openSet;
$('#setClose').onclick=()=>$('#sheetSet').classList.remove('show');
$('#setSave').onclick=()=>{S={key:$('#inKey').value.trim(),model:$('#inModel').value};ls.set('bs_settings',S);autoOff=false;$('#sheetSet').classList.remove('show');toast(S.key?'Saved':'Key removed');render();loadMore(false)};
$('#setClear').onclick=()=>{saved=[];gen=[];ls.set('bs_saved',[]);ls.set('bs_gen',[]);items=shuffle(SEED);$('#sheetSet').classList.remove('show');toast('Cleared');render()};
$('#moreClose').onclick=()=>$('#sheetMore').classList.remove('show');
['sheetSet','sheetMore'].forEach(id=>$('#'+id).addEventListener('click',e=>{if(e.target.id===id)e.target.classList.remove('show')}));

renderChips();render();
loadMore(false);
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
